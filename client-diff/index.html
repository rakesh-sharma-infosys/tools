<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infosys | Client - Difference</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Difference Checker</h1>
        <p>Paste, upload or drop two texts / files and see what changed.</p>
    </header>

    <main>
        <!-- The two inputs: each can be typed into, pasted into, uploaded or dropped onto. -->
        <section class="input-panels" aria-label="Inputs">
            <diff-client-text-panel id="original-text-panel" heading="Original"></diff-client-text-panel>
            <diff-client-text-panel id="modified-text-panel" heading="Modified"></diff-client-text-panel>
        </section>

        <!-- Controls: layout of the result, comparison options and quick actions. -->
        <section class="toolbar" aria-label="Options">
            <diff-client-segmented-toggle id="view-mode-toggle"
                options="unified:Unified,horizontal:Horizontal split,vertical:Vertical split"
                value="unified"></diff-client-segmented-toggle>
            <diff-client-option-checkbox id="ignore-case-checkbox" label="Ignore case"></diff-client-option-checkbox>
            <diff-client-option-checkbox id="ignore-whitespace-checkbox" label="Ignore whitespace"></diff-client-option-checkbox>
            <button type="button" id="swap-button">⇄ Swap sides</button>
            <button type="button" id="clear-all-button">Clear all</button>
            <diff-client-diff-stats id="diff-statistics"></diff-client-diff-stats>
        </section>

        <diff-client-diff-view id="diff-result-view" mode="unified"
            left-heading="Original" right-heading="Modified"></diff-client-diff-view>
    </main>

    <footer>Everything runs locally in your browser; nothing is uploaded anywhere.</footer>

    <!-- Classic scripts (not modules) so the page also works when opened from file://. Order matters. -->
    <script src="scripts/diff-client-toolkit.js"></script>
    <script src="scripts/text-difference-engine.js"></script>
    <script src="scripts/components/diff-client-segmented-toggle.js"></script>
    <script src="scripts/components/diff-client-option-checkbox.js"></script>
    <script src="scripts/components/diff-client-file-picker-button.js"></script>
    <script src="scripts/components/diff-client-text-panel.js"></script>
    <script src="scripts/components/diff-client-diff-stats.js"></script>
    <script src="scripts/components/diff-client-diff-pane.js"></script>
    <script src="scripts/components/diff-client-diff-view.js"></script>
    <script src="main.js"></script>
</body>
</html>
